[package]
name = "wtg-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
default-run = "wtg"

[[bin]]
name = "wtg"
path = "src/main.rs"

[[bin]]
name = "wtg-ui"
path = "src/bin/wtg-ui.rs"

[dependencies]
wtg-core = { path = "../wtg-core" }
wtg-providers = { path = "../wtg-providers" }
# Experimental egui desktop UI
eframe = "0.27"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Explicit CLI config parsing
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
