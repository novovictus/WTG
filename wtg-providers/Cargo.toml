[package]
name = "wtg-providers"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
name = "wtg_providers"
path = "src/lib.rs"

[[bin]]
name = "wtg-provider-probe"
path = "src/bin/wtg-provider-probe.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
